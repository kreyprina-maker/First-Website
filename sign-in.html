<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .signin-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 420px;
      padding: 2.5rem 2rem;
    }

    .signin-container h1 {
      font-size: 1.8rem;
      color: #0f172a;
      margin-bottom: 0.4rem;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .input-group {
      margin-bottom: 1.3rem;
    }

    .input-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 0.4rem;
      color: #334155;
    }

    .input-group input {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .forgot {
      text-align: right;
      margin-bottom: 1.5rem;
    }

    .forgot a {
      font-size: 0.9rem;
      color: #38bdf8;
      text-decoration: none;
    }

    .forgot a:hover {
      text-decoration: underline;
    }

    .btn {
      width: 100%;
      padding: 0.95rem;
      background: #0f172a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #1e293b;
    }

    .back-home {
      text-align: center;
      margin-top: 1.8rem;
    }

    .back-home a {
      color: #94a3b8;
      font-size: 0.9rem;
      text-decoration: none;
    }

    .back-home a:hover {
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="signin-container">
    <h1>Sign In</h1>
    <p class="subtitle">Welcome back! Please sign in to continue</p>

    <form onsubmit="event.preventDefault(); alert('Sign In successful! (Demo only)');">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="forgot">
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn">Sign In</button>
    </form>

    <div class="back-home">
      <a href="index.html">← Back to Home</a>
    </div>
  </div>

</body>
</html>
